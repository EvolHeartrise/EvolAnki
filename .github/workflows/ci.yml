name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      # Includes corepack, which provides yarn.
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: 22

      # Reads the version from rust-toolchain.toml.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 #v1
        with:
          components: clippy
          cache: true
          # .cargo/config.toml builds here, not in the default target/
          cache-workspaces: ". -> out/rust"
          cache-key: out-rust
          rustflags: "" # don't inject -D warnings; the lint recipe handles that

      - name: Install cargo-nextest and just
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 #v2.85.7
        with:
          tool: cargo-nextest@0.9.99,just

      # Rust formatting needs the nightly in cargo/format, which rustup installs by itself.
      - name: Check formatting
        run: just fmt

      # Separately from the lint, as svelte-check can break a web build it overlaps.
      - name: Build the pages
        run: just build

      - name: Build the server
        run: cargo build --locked -p evolanki-server

      - name: Lint
        run: just lint

      - name: Test
        run: just test
