name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  N2_OUTPUT_PROGRESS: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ninja-build rsync

      # Reads the version from rust-toolchain.toml.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 #v1
        with:
          components: clippy
          cache: true
          # ninja builds here, not in the default target/
          cache-workspaces: ". -> out/rust"
          # a new key, as main already has a cache without compiled code under the old one
          cache-key: out-rust
          rustflags: "" # don't inject -D warnings; the build handles that

      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 #v2.85.7
        with:
          tool: cargo-nextest@0.9.99

      # check:format needs the nightly in cargo/format, which rustup installs by itself.
      - name: Check formatting
        run: ./ninja check:format

      # Separately from the checks, as check:svelte can break a web build it overlaps.
      - name: Build
        run: ./ninja web

      - name: Lint
        run: ./ninja check:clippy check:eslint check:svelte

      - name: Test
        run: ./ninja check:rust_test check:vitest

