name: Setup Anki Build Environment
description: Install system dependencies, Rust toolchain, and n2

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          autoconf \
          bash \
          curl \
          findutils \
          g++ \
          gcc \
          git \
          grep \
          libssl-dev \
          make \
          pkg-config \
          rsync \
          unzip \
          zstd

    - name: Install rsync (Windows)
      if: runner.os == 'Windows'
      id: setup-msys2
      uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c #v2
      with:
        update: false
        install: rsync

    - name: Add MSYS2 usr/bin to PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "${{ steps.setup-msys2.outputs.msys2-location }}\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Reads toolchain version from rust-toolchain.toml automatically.
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 #v1
      with:
        components: clippy, llvm-tools-preview
        cache: false # ci.yml manages its own cargo cache
        rustflags: "" # don't inject -D warnings; the build system handles this

    # Ensure cargo-installed tools like n2 are discoverable.
    - name: Add CARGO_HOME/bin to PATH
      shell: bash
      run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

    - name: Install n2
      shell: bash
      run: |
        if ! command -v n2 &>/dev/null; then
          tools/install-n2
        fi
