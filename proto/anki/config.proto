syntax = "proto3";

option java_multiple_files = true;

package anki.config;

import "anki/generic.proto";

service ConfigService {
  rpc GetConfigBool(GetConfigBoolRequest) returns (generic.Bool);
}

message ConfigKey {
  // The only setting the pages read this way. Desktop Anki's others are gone.
  enum Bool {
    HIDE_AUDIO_PLAY_BUTTONS = 0;
    reserved 1 to 28;
  }
}

message GetConfigBoolRequest {
  ConfigKey.Bool key = 1;
}
