syntax = "proto3";

option java_multiple_files = true;

package anki.i18n;

import "anki/generic.proto";

// Implemented on the backend, so it doesn't need the collection lock.
// Implemented on the Backend, as it works without an open collection.
service BackendI18nService {
  rpc I18nResources(I18nResourcesRequest) returns (generic.Json);
}

message I18nResourcesRequest {
  repeated string modules = 1;
}
