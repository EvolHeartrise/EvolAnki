<!doctype html>
<!--
Hosts untrusted card HTML. Served with `sandbox allow-scripts`, so its origin is
opaque whichever way it is opened; see src/frame.rs and docs/web-server.md.

The CSP allows the nonced scripts below and MathJax, so nothing in a card runs: not
its script tags, not inline handlers, not javascript: links. The private MessagePort
would stay out of reach even if something did, as it's captured in a closure before
any card content arrives, and the parent listens to nothing else.
-->
<html>
<head>
<meta charset="utf-8">
<script nonce="@NONCE@">
(function () {
    "use strict";
    window.ankiAssetBase = new URL("../a/", document.baseURI).href;
    let post = null;

    function setTheme(dark) {
        const root = document.documentElement;
        root.classList.toggle("night-mode", dark);
        if (dark) {
            root.dataset.bsTheme = "dark";
        } else {
            delete root.dataset.bsTheme;
        }
    }

    function onPortMessage(event) {
        const msg = event.data;
        switch (msg.type) {
            case "question":
                setTheme(msg.dark);
                // before the card's scripts run, which Qt only manages from the second card
                document.body.className = msg.bodyClass;
                window._showQuestion(msg.html, msg.answer, msg.bodyClass);
                window._queueAction(() => post({ type: "shown", seq: msg.seq }));
                break;
            case "answer":
                setTheme(msg.dark);
                window._showAnswer(msg.html, msg.bodyClass);
                window._queueAction(() => post({ type: "shown", seq: msg.seq }));
                break;
            case "theme":
                setTheme(msg.dark);
                document.body.classList.toggle("nightMode", msg.dark);
                document.body.classList.toggle("night_mode", msg.dark);
                break;
            case "getTyped": {
                const input = document.getElementById("typeans");
                post({ type: "typed", value: input ? String(input.value) : "" });
                break;
            }
            case "static":
                setTheme(msg.dark);
                // innerHTML doesn't run scripts, and the CSP blocks everything else
                document.getElementById("content").innerHTML = msg.html;
                break;
        }
    }

    // Removed after one use, so that a card can't hand us a port of its own.
    window.addEventListener("message", function init(event) {
        if (event.source !== window.parent || event.ports.length !== 1) {
            return;
        }
        window.removeEventListener("message", init);
        const port = event.ports[0];
        post = port.postMessage.bind(port);
        port.onmessage = onPortMessage;
        post({ type: "ready" });
        new ResizeObserver(() => {
            post({ type: "resize", height: document.documentElement.scrollHeight });
        }).observe(document.documentElement);
    });

    // Only real key presses count.
    window.addEventListener("keydown", (event) => {
        if (!event.isTrusted || !post || event.ctrlKey || event.metaKey || event.altKey) {
            return;
        }
        const target = event.target;
        const tag = target && target.tagName;
        const editing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT"
            || (target && target.isContentEditable);
        if (editing && !(event.key === "Enter" && target.id === "typeans")) {
            return;
        }
        if (event.key === " ") {
            event.preventDefault();
        }
        post({ type: "key", key: event.key, repeat: event.repeat });
    }, true);

    // What cards used inline handlers for, and links. The sandbox has no popups, and
    // following a link would replace the card.
    document.addEventListener("click", (event) => {
        const link = event.target && event.target.closest && event.target.closest("a[href]");
        if (!link) {
            return;
        }
        const play = /^([qa]):(\d{1,6})$/.exec(link.dataset.play || "");
        if (play) {
            event.preventDefault();
            if (event.isTrusted && post) {
                post({ type: "play", side: play[1], index: Number(play[2]) });
            }
            return;
        }
        if (link.dataset.hint) {
            // from the hint: filter in rslib/src/template_filters.rs
            event.preventDefault();
            const hint = document.getElementById(link.dataset.hint);
            if (hint) {
                link.style.display = "none";
                hint.style.display = "block";
            }
            return;
        }
        if ((link.getAttribute("href") || "").startsWith("#")) {
            return;
        }
        event.preventDefault();
        if (event.isTrusted && post && /^https?:/i.test(link.href)) {
            post({ type: "open", url: link.href });
        }
    }, true);
})();
</script>
<link rel="stylesheet" href="../a/css/webview.css">
@HEAD@
<style>
html { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
@STYLE@
</style>
</head>
<body>
@BODY@
</body>
</html>
