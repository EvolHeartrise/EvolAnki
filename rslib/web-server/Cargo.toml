[package]
name = "evolanki-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Single-user web server around Anki's Rust backend"

[[bin]]
path = "src/main.rs"
name = "evolanki-server"

[build-dependencies]
anki_proto.workspace = true
anki_proto_gen.workspace = true
anyhow.workspace = true
inflections.workspace = true
prost-reflect.workspace = true

[dependencies]
anki.workspace = true
anki_proto.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
percent-encoding = "2.3.2"
prost.workspace = true
rand.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time", "sync"] }
tower = "0.5"
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.0.8", features = ["system"] }

[dev-dependencies]
tempfile.workspace = true
